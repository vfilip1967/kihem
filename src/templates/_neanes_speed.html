    <label class="speed-select" for="speed-select">Ταχύτητα:
      <select id="speed-select">
        {% for value in (0.4, 0.5, 0.6, 0.7, 0.8, 0.9, 1.0, 1.25) %}<option value="{{ value }}">{{ (value * 100)|round|int }}%</option>{% endfor %}
      </select>
    </label>
    <button type="button" id="speed-slower" class="speed-step" title="5% πιο αργά, και κατά την εκτέλεση" aria-label="Πιο αργά">−</button>
    <button type="button" id="speed-faster" class="speed-step" title="5% πιο γρήγορα, και κατά την εκτέλεση" aria-label="Πιο γρήγορα">+</button>
    <script>
      /* Neanes multiplies the score's tempo by audioOptions.speed and, like the
         ison volume, reads it only when it starts.  Each score has a catalogue
         default (koinonika are sung slowly); a student's own choice is kept per
         score and written to the player's storage before the iframe loads. */
      (() => {
        const key = {{ ('kihem-speed-' ~ score.score_id)|tojson }};
        const fallback = {{ score.playback_speed|tojson }};
        let speed = fallback;
        try {
          const chosen = Number.parseFloat(localStorage.getItem(key));
          if (chosen >= 0.1 && chosen <= 3) speed = chosen;
          const saved = JSON.parse(localStorage.getItem('audioOptionsDefault') || '{}') || {};
          saved.speed = speed;
          localStorage.setItem('audioOptionsDefault', JSON.stringify(saved));
        } catch (error) { /* storage unavailable: Neanes keeps its defaults */ }
        const select = document.getElementById('speed-select');
        if (!select) return;
        if (![...select.options].some((option) => Number(option.value) === speed)) {
          select.add(new Option(`${Math.round(speed * 100)}%`, String(speed)));
        }
        select.value = [...select.options].find((option) => Number(option.value) === speed).value;
        // The chanter may judge the tempo while it sounds.  Neanes plans the
        // whole playback when it starts and disables its own speed field while
        // playing, so a change made now pauses it, sets the new speed through
        // Neanes' own field, selects the element that was sounding and plays
        // again from there.  If the frame is not available it just reloads.
        const pause = (ms) => new Promise((resolve) => window.setTimeout(resolve, ms));
        const applyLive = async (value) => {
          const frame = document.getElementById('neanes-player');
          const doc = frame && frame.contentDocument;
          const input = doc && doc.getElementById('audio-speed-input');
          if (!input) return false;
          const sounding = doc.querySelector('.audio-selected');
          const pauseButton = doc.querySelector('button[aria-label="Pause audio"]');
          if (pauseButton) { pauseButton.click(); await pause(150); }
          input.focus();
          const setter = Object.getOwnPropertyDescriptor(frame.contentWindow.HTMLInputElement.prototype, 'value').set;
          setter.call(input, String(Math.round(value * 100)));
          input.dispatchEvent(new frame.contentWindow.Event('input', { bubbles: true }));
          input.dispatchEvent(new frame.contentWindow.Event('change', { bubbles: true }));
          input.dispatchEvent(new frame.contentWindow.KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
          input.blur();
          await pause(150);
          if (!pauseButton) return true;
          if (sounding) sounding.click();
          await pause(100);
          const playButton = doc.querySelector('button[aria-label="Play audio"]');
          if (playButton) playButton.click();
          return true;
        };
        const choose = async (value) => {
          if (!(value >= 0.1 && value <= 3)) return;
          if (![...select.options].some((option) => Number(option.value) === value)) {
            select.add(new Option(`${Math.round(value * 100)}%`, String(value)));
          }
          select.value = String([...select.options].find((option) => Number(option.value) === value).value);
          try {
            localStorage.setItem(key, String(value));
            const saved = JSON.parse(localStorage.getItem('audioOptionsDefault') || '{}') || {};
            saved.speed = value;
            localStorage.setItem('audioOptionsDefault', JSON.stringify(saved));
          } catch (error) { /* storage unavailable: the change still applies now */ }
          let live = false;
          try { live = await applyLive(value); } catch (error) { live = false; }
          if (!live) window.location.reload();
        };
        select.addEventListener('change', () => { void choose(Number(select.value)); });
        for (const [id, delta] of [['speed-slower', -0.05], ['speed-faster', 0.05]]) {
          const button = document.getElementById(id);
          if (button) button.addEventListener('click', () => {
            void choose(Math.round((Number(select.value) + delta) * 100) / 100);
          });
        }
      })();
    </script>
